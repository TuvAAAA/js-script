<!DOCTYPE html>
<html>
<body>

    <h2>document.getElementById</h2>

    <p id="demo">1</p>

    <p id="test">2</p>

    <script>
        //Hämta elementet med id:t demo och tilldelar den texten "Hej, Världen!"
        document.getElementById("test").textContent = "Hej, Världen!";

    </script>

</body>
</html>

<!--
********************************************************
Med koden document.getElementById kan man ändra innehållet i HTML-element.

ÖVNING: Ändra i JavaScript koden så att texten "Hej, Världen!"
skrivs istället för texten "2" i p-elementet.
********************************************************
